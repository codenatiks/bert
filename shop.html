<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Collection — NOCTURNE Bedding House</title>
<meta name="description" content="Browse the Nocturne collection: duvet suites, sheets, pillowcases and layers in percale, sateen, linen, flannel and waffle.">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" fill="%230D1522"/><path d="M22 5a12 12 0 1 0 5.5 17A14 14 0 0 1 22 5z" fill="%23C8A465"/></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">
<main id="main">

  <section class="page-hero">
    <div class="stars" aria-hidden="true"></div>
    <div class="wrap">
      <p class="eyebrow rv">The collection</p>
      <h1 class="page-title rv">
        <span class="ln"><span>Woven for the <em>hours</em></span></span>
        <span class="ln"><span>you lose.</span></span>
      </h1>
      <p class="page-sub rv">Fourteen pieces. Five weaves. Twenty-seven shades. Every one cut from cloth we made ourselves.</p>
    </div>
  </section>

  <div class="toolbar" id="toolbar">
    <div class="wrap tb-in">
      <div class="chip-row" id="catChips"></div>
      <div class="tb-right">
        <input type="search" class="tb-search" id="searchInp" placeholder="Search the collection…" aria-label="Search products">
        <select class="tb-select" id="fabSel" aria-label="Filter by fabric"></select>
        <select class="tb-select" id="sortSel" aria-label="Sort products">
          <option value="featured">Sort · Featured</option>
          <option value="price-asc">Sort · Price ↑</option>
          <option value="price-desc">Sort · Price ↓</option>
          <option value="name">Sort · A → Z</option>
        </select>
      </div>
    </div>
  </div>

  <section class="wrap shop-body">
    <p class="grid-note" id="gridNote"></p>
    <div class="pgrid" id="pgrid"></div>
  </section>

</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
